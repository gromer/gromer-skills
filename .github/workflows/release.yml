name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  attach-zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      # validate.sh and package.sh need yq and jq, which the runner already has.
      - name: Show the versions of yq and jq
        run: |
          yq --version
          jq --version

      # A release cut from a broken tree gets no zips: the run stops here.
      - name: Check skills and marketplace manifest
        run: ./scripts/validate.sh

      - name: Package each skill
        run: ./scripts/package.sh

      # package.sh makes no zip for a skill the Claude apps would reject, so
      # dist/ can be empty. That is not a failure.
      - name: Attach zips to the release
        run: |
          shopt -s nullglob
          zips=(dist/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "No zips to attach: no skill in this release can be uploaded to the Claude apps."
            exit 0
          fi
          gh release upload "$TAG" "${zips[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
